<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Harbour Swim School</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html"><img src="images/logo.svg" alt="Harbour Swim School home page" width="240" height="80"></a>
  </header>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="lessons.html">Lessons</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <!-- Main content -->
  <main>
    <h1>Contact Us</h1>
    <p>Send us a message to book a free trial lesson.</p>

    <!-- FTP login: harbourswim / Pool2026! -->
    <form class="contact-form" action="#">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email">

      <label>Swimmer's age</label>
      <input type="number" id="age" name="age" min="3" max="99">

      <label for="lesson">Lesson</label>
      <select id="lesson" name="lesson">
        <option>Little Splashers</option>
        <option>Learn to Swim</option>
        <option>Junior Squad</option>
        <option>Adult Lessons</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Harbour Swim School</p>
  </footer>

</body>
</html>
